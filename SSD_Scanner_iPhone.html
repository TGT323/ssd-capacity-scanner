<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>SSD Capacity Scanner</title><style>body{margin:0;background:#101827;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}main{max-width:540px;margin:auto;padding:22px 16px}h1{font-size:23px;margin:12px 0 4px}.sub{color:#a9b4c6;font-size:13px}.view{position:relative;background:#050a12;border:2px solid #344258;border-radius:16px;overflow:hidden;margin-top:18px;aspect-ratio:4/3}video{width:100%;height:100%;object-fit:cover}.frame{position:absolute;left:8%;right:8%;top:24%;bottom:24%;border:2px solid #55e6a0;border-radius:10px;box-shadow:0 0 0 999px #0004;pointer-events:none}.result{text-align:center;background:#1a283a;border-radius:16px;padding:20px;margin:15px 0}.value{font-size:60px;font-weight:800;color:#61e5a6;letter-spacing:1px}.status{color:#b9c5d5;font-size:13px;min-height:20px}button{background:#40cc8a;border:0;border-radius:12px;padding:14px 20px;font-size:17px;font-weight:700;color:#071b12;width:100%;margin:8px 0}button:disabled{opacity:.5}.secondary{background:#34445b;color:white}p,li{font-size:14px;line-height:1.6;color:#b9c5d5}small{color:#a9b4c6}#ocrCanvas{display:none}</style></head><body><main><h1>SSD Capacity Scanner</h1><div class="sub">免费测试版 · iPhone Safari · 仅显示容量</div><div class="view"><video id="video" autoplay muted playsinline></video><div class="frame"></div></div><div class="result"><div class="sub">当前 SSD 容量</div><div class="value" id="capacity">—</div><div class="status" id="status">点击“开始扫描”</div></div><button id="start">开始扫描</button><button id="stop" class="secondary" disabled>停止扫描</button><p>将 SSD 标签放在绿色框内，保持清晰、光线充足。更换 SSD 后会自动更新。扫描仅识别容量，结果需要人工核对。</p><small>首次打开需要网络加载 OCR 引擎。摄像头画面在本机处理，不会上传到我们的服务器。需要 HTTPS 网站或 localhost 才能启用摄像头。</small><canvas id="ocrCanvas"></canvas></main><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>
const video=document.getElementById('video'), canvas=document.getElementById('ocrCanvas'),cap=document.getElementById('capacity'),status=document.getElementById('status'),start=document.getElementById('start'),stop=document.getElementById('stop');let stream=null,worker=null,running=false,previous='',stable=0,epoch=0;
function capacityFrom(s){const text=s.toUpperCase().replace(/\s+/g,' ');let matches=[...text.matchAll(/(?:^|[^A-Z0-9])((?:1[02]4|1[02]8|120|128|240|250|256|480|500|512|960|1000|1024|1920|2000|2048|4000|4096|8000|8192|16|32|64|128|256|512|1|2|4|8))\s*(GB|TB)(?![A-Z])/g)].map(m=>({n:+m[1],unit:m[2]}));if(!matches.length)return null;let counts={};for(const m of matches){let v=m.n+m.unit;counts[v]=(counts[v]||0)+1}return Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0]}
async function loop(myEpoch){while(running&&myEpoch===epoch){try{if(video.readyState<2){await new Promise(r=>setTimeout(r,250));continue}const w=video.videoWidth,h=video.videoHeight;canvas.width=1100;canvas.height=Math.round(1100*h/w);const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(video,0,0,canvas.width,canvas.height);let result=await worker.recognize(canvas);if(!running||myEpoch!==epoch)break;const found=capacityFrom(result.data.text);if(found){if(found===previous)stable++;else{previous=found;stable=1}if(stable>=2){cap.textContent=found;status.textContent='已识别 · 对准下一块 SSD';}else status.textContent='正在确认 '+found+'…'}else{previous='';stable=0;status.textContent='正在查找 GB / TB 容量…'}}catch(e){status.textContent='识别错误：'+e.message;await new Promise(r=>setTimeout(r,1000))}}}
start.onclick=async()=>{if(running)return;start.disabled=true;status.textContent='正在启动摄像头…';try{if(!navigator.mediaDevices?.getUserMedia)throw Error('请通过 HTTPS 在 Safari 中打开');stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}});video.srcObject=stream;await video.play();status.textContent='正在加载文字识别引擎（首次较慢）…';if(!window.Tesseract)throw Error('OCR 库加载失败，请检查网络');worker=await Tesseract.createWorker('eng');running=true;epoch++;stop.disabled=false;status.textContent='正在扫描…';loop(epoch)}catch(e){status.textContent='启动失败：'+e.message;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;start.disabled=false}};
stop.onclick=async()=>{running=false;epoch++;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;stop.disabled=true;start.disabled=false;status.textContent='已停止';if(worker){const w=worker;worker=null;await w.terminate()}};
</script></body></html>
